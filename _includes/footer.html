{% include base_path %}

<!-- ===================== FOOTER WITH BACKGROUND IMAGE ===================== -->
<footer class="page__footer" style="
  background-image: url('{{ '/assets/images/footer_image.png' | relative_url }}');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
">

  <!-- Overlay (optional but recommended for readability) -->
  <div style="
    background: rgba(0, 0, 0, 0.35);
    padding: 1.2rem 0;
    text-align: center;
  ">

    <!-- Minimal social icons -->
    <div style="font-size:1.2em; margin-bottom:0.6rem;">

      <a href="mailto:rejane.paulino@msstate.edu"
         title="Email"
         style="margin:0 0.7rem; color:white;">
        <i class="fas fa-envelope"></i>
      </a>

      <a href="https://github.com/rejane-paulino"
         title="GitHub"
         target="_blank"
         style="margin:0 0.7rem; color:white;">
        <i class="fab fa-github"></i>
      </a>

      <a href="https://orcid.org/0000-0000-0000-0000"
         title="ORCID"
         target="_blank"
         style="margin:0 0.7rem; color:white;">
        <i class="ai ai-orcid"></i>
      </a>

      <a href="https://scholar.google.com/citations?user=XXXX"
         title="Google Scholar"
         target="_blank"
         style="margin:0 0.7rem; color:white;">
        <i class="ai ai-google-scholar"></i>
      </a>

    </div>

    <!-- Copyright -->
    <div style="font-size:0.8em; color:white;">
      © {{ site.time | date: '%Y' }} {{ site.name | default: site.title }} ·
      Figures produced by the author · Reuse permitted with attribution
    </div>

  </div>
</footer>
